[package]
name = "detox-mac"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "macOS maintenance from the command line: cleanup, diagnostics and startup agents."
authors = ["Sn0wAlice"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Sn0wAlice/detox-mac"
readme = "README.md"
keywords = ["macos", "cleaner", "maintenance", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
