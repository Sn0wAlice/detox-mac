name: Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: apple-silicon
            target: aarch64-apple-darwin
          - arch: intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          VERSION=$(cargo pkgid | sed 's/.*[#@]//')
          NAME=detox-$VERSION-${{ matrix.target }}
          tar -czf $NAME.tar.gz -C target/${{ matrix.target }}/release detox
          shasum -a 256 $NAME.tar.gz > $NAME.tar.gz.sha256
          echo "NAME=$NAME" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          # Re-running the workflow on an existing release just replaces the assets.
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes --target "$GITHUB_SHA" \
            || gh release upload "$TAG" dist/* --clobber
